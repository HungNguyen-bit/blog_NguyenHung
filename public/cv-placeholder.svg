    <text x="40" y="80" font-family="Arial, Helvetica, sans-serif" font-size="48" fill="#065f46">CV Nguyễn Hưng</text>
    <rect x="40" y="120" width="320" height="420" rx="8" fill="#e5e7eb" stroke="#9ca3af"/>
    <text x="40" y="580" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#374151">(Ảnh CV chưa được thêm vào thư mục <tspan font-family='monospace'>/public</tspan>)</text>
    <text x="40" y="620" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6b7280">Vui lòng tải hình ảnh CV lên đường dẫn: <tspan font-family='monospace' fill="#065f46">/public/cv.jpg</tspan></text>
    <g transform="translate(40,700)">
